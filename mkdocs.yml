site_name: WriteAmp
site_description: >-
  Write once, read many. A working notebook on software architecture: patterns,
  algorithms, and the design of scalable systems, with real-world case studies
  and the trade-offs behind every decision.
site_author: Jeet Parekh
site_url: https://writeamp.com/
repo_url: https://github.com/jeetparekh3005/writeamp
repo_name: jeetparekh3005/writeamp
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Jeet Parekh

# Content lives at the repo root (not a docs/ subdir).
docs_dir: .
site_dir: site

# Keep non-content out of the build.
exclude_docs: |
  .github/
  site/
  node_modules/
  requirements-docs.txt
  CONTRIBUTING.md
  **/.gitkeep

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/notebook-outline
  features:
    - navigation.indexes    # section landing pages are clickable
    - navigation.top        # back-to-top button
    - navigation.tracking   # url tracks the active anchor
    - navigation.prune      # keep the rendered nav DOM lean
    - navigation.instant
    - navigation.footer     # prev/next links at the page bottom
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit   # "edit this page" button
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - same-dir      # allows docs_dir to be the repo root (where mkdocs.yml lives)
  - search
  - awesome-pages # auto-builds nav from the folder tree; order via .pages files

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Navigation is generated from the folder tree by the awesome-pages plugin.
# Order is controlled by .pages files in each directory; every folder has a
# README.md that serves as its section landing page.
