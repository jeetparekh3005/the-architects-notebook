site_name: The Architect's Notebook
site_description: >-
  A working notebook on software architecture — patterns, algorithms, and the
  design of scalable systems, with real-world case studies and the trade-offs
  behind every decision.
site_author: Jeet Parekh
site_url: https://jeetparekh3005.github.io/the-architects-notebook/
repo_url: https://github.com/jeetparekh3005/the-architects-notebook
repo_name: jeetparekh3005/the-architects-notebook
copyright: Copyright &copy; 2026 Jeet Parekh

# Content lives at the repo root (not a docs/ subdir).
docs_dir: .
site_dir: site

# Keep non-content out of the build.
exclude_docs: |
  .github/
  site/
  node_modules/
  requirements-docs.txt
  CONTRIBUTING.md
  **/.gitkeep

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - roamlinks   # resolves [[wiki-style]] links by filename

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Patterns: patterns/README.md
  - Algorithms:
      - Overview: algorithms/README.md
      - Consistent Hashing: algorithms/consistent-hashing.md
  - Foundations: foundations/README.md
  - AI Systems:
      - Overview: ai-systems/README.md
      - RAG — Evaluation: ai-systems/rag/evaluation.md
  - System Design: system-design/README.md
  - Case Studies:
      - Overview: case-studies/README.md
      - Teardown Template: case-studies/_template.md
  - Cross-Cutting: cross-cutting/README.md
  - Decisions:
      - Overview: decisions/README.md
      - ADR Template: decisions/_template.md
  - Engineering Leadership: engineering-leadership/README.md
  - Reading:
      - DDIA: reading/ddia.md
