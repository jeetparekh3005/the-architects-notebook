intent, not effect</text><g transform="translate(920,888)"><rect x="-25" y="-24" width="58" height="58" rx="5" fill="#111"></rect><rect x="-29" y="-29" width="58" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"></rect><g stroke-width="2" style="color:#111"><path d="M0 -17 L15 -8 L15 9 L0 18 L-15 9 L-15 -8 Z" class="df-gl"></path><circle cx="0" cy="1" r="3" class="df-gl df-f"></circle></g></g><rect x="840" y="924" width="160" height="31" rx="4" fill="#fbfdf7"></rect><text x="920" y="937" class="df-nm" text-anchor="middle">External API</text><text x="920" y="950" class="df-ns" text-anchor="middle">idempotency key required</text><g><circle cx="580" cy="458" r="9" fill="#0f9b8e" filter="url(#df-glow)" fill-opacity="0.5"></circle><circle cx="580" cy="458" r="4.2" fill="#0f9b8e"></circle><circle cx="580" cy="458" r="1.3" fill="#fff"></circle><circle cx="447.70000000000005" cy="557.7" r="7" fill="#0f9b8e" filter="url(#df-glow)" fill-opacity="0.5"></circle><circle cx="447.70000000000005" cy="557.7" r="3.6" fill="#0f9b8e"></circle><circle cx="447.70000000000005" cy="557.7" r="1.3" fill="#fff"></circle><circle cx="920" cy="678" r="7" fill="#0f9b8e" filter="url(#df-glow)" fill-opacity="0.5"></circle><circle cx="920" cy="678" r="3.6" fill="#0f9b8e"></circle><circle cx="920" cy="678" r="1.3" fill="#fff"></circle></g></svg>