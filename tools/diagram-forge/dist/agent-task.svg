><text x="580" y="289" class="df-nm" text-anchor="middle">Admission queue</text><text x="580" y="302" class="df-ns" text-anchor="middle">rate limit · backpressure</text><g transform="translate(580,400)"><rect x="-25" y="-24" width="58" height="58" rx="5" fill="#111"></rect><rect x="-29" y="-29" width="58" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"></rect><g stroke-width="2" style="color:#111"><circle cx="0" cy="0" r="16" class="df-gl"></circle><circle cx="0" cy="0" r="6" class="df-gl"></circle><path d="M0 -16 v-5 M0 16 v5 M-16 0 h-5 M16 0 h5" class="df-gl"></path></g></g><rect x="506" y="436" width="148" height="31" rx="4" fill="#fbfdf7"></rect><text x="580" y="449" class="df-nm" text-anchor="middle">Orchestrator</text><text x="580" y="462" class="df-ns" text-anchor="middle">graph runner · retries</text><g transform="translate(300,564)"><rect x="-25" y="-24" width="58" height="58" rx="5" fill="#111"></rect><rect x="-29" y="-29" width="58" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"></rect><g stroke-width="2" style="color:#111"><path d="M-14 8 a9 9 0 0 1 3 -17 a11 11 0 0 1 20 4 a7 7 0 0 1 -1 13 Z" class="df-gl"></path></g></g><rect x="226" y="600" width="148" height="31" rx="4" fill="#fbfdf7"></rect><text x="300" y="613" class="df-nm" text-anchor="middle">LLM gateway</text><text x="300" y="626" class="df-ns" text-anchor="middle">timeout · token budget</text><g transform="translate(860,564)"><rect x="-25" y="-24" width="58" height="58" rx="5" fill="#111"></rect><rect x="-29" y="-29" width="58" height="58" rx="5" fill="#fff" stroke="#111" stroke-width="2"></rect><g stroke-width="2" style="color:#111"><rect x="-16" y="-13" width="32" height="26" rx="4" class="df-gl"></rect><path d="M-9 -4 h18 M-9 4 h12" class="df-gl"></path></g></g><rect x="786" y="600" width="148" height="31" rx="4" fill="#fbfdf7"></rect><text x="860" y="613" class="df-nm" text-anchor="middle">Tool runner</text><text x="860" y="626" class="df-ns" text-anchor="middle