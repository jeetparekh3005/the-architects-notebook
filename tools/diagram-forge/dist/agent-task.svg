<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 1000" class="df-svg" role="img" aria-label="One agent task, run like it will fail. Components: Caller, Admission queue, Orchestrator, LLM gateway, Tool runner, Checkpoint store, Vector index, Outbox, External API." xmlns="http://www.w3.org/2000/svg"><style>.df-wrap{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#111}
.df-badge{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#111;background:#ffd23f;display:inline-block;padding:4px 9px;border:2px solid #111;border-radius:4px;box-shadow:2px 2px 0 #111}
.df-title{font-size:clamp(22px,3.3vw,33px);letter-spacing:-.02em;margin:12px 0 6px;font-weight:800}
.df-sub{color:#444;font-size:14.5px;max-width:82ch;margin:0 0 14px;line-height:1.5}
.df-legend{display:inline-flex;flex-wrap:wrap;gap:0;align-items:stretch;background:#fff;border:2px solid #111;border-radius:8px;box-shadow:3px 3px 0 #111;overflow:hidden;font-family:ui-monospace,Menlo,monospace}
.df-legend .k{display:flex;align-items:center;gap:9px;padding:11px 15px;border-right:2px solid #111;font-size:12.5px;font-weight:700;white-space:nowrap}
.df-legend .k:last-child{border-right:0}
.df-legend .g{font-weight:400;color:#777;font-size:11px}
.df-legend .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:11px 12px;background:#111;color:#fff;display:flex;align-items:center}
.df-svg{display:block;width:100%;height:auto;margin-top:14px}
.df-gl{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.df-gl.df-f{fill:currentColor}
.df-nm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;letter-spacing:.01em;fill:#111}
.df-ns{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.02em;fill:#8a8a8a}
.df-tl{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;fill:#9a9a94}</style><defs><filter id="df-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter><marker id="df-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L9 5 L0 9 Z" fill="#111"></path></marker><pattern id="df-gp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 H0 V20" fill="none" stroke="#cfe0d8" stroke-width="1"></path></pattern><pattern id="df-gp2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0 H0 V100" fill="none" stroke="#bcd3c8" stroke-width="1.4"></path></pattern></defs><rect x="0" y="0" width="1160" height="1000" fill="#fbfdf7"></rect><rect x="0" y="0" width="1160" height="1000" fill="url(#df-gp)"></rect><rect x="0" y="0" width="1160" height="1000" fill="url(#df-gp2)"></rect><text x="40" y="56" class="df-tl" text-anchor="start">CALLER</text><text x="40" y="216" class="df-tl" text-anchor="start">ADMISSION</text><text x="40" y="376" class="df-tl" text-anchor="start">ORCHESTRATION</text><text x="40" y="540" class="df-tl" text-anchor="start">REMOTE CALLS · EACH CAN FAIL</text><text x="40" y="704" class="df-tl" text-anchor="start">STATE · SIDE EFFECTS</text><text x="40" y="864" class="df-tl" text-anchor="start">THE REAL WORLD</text><path d="M580 111 L 580 209" fill="none" stroke="#111" stroke-width="2" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#df-arrow)"></path><path d="M580 271 L 580 369" fill="none" stroke="#111" stroke-width="2" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#df-arrow)"></path><path d="M580 431 L 580 469.4 L 300 469.4 L 300 533" fill="none" stroke="#111" stroke-width="4" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="round" marker-end="url(#df-arrow)"></path><path d